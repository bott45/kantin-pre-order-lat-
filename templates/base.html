<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kantin Sekolah{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <div class="wrap nav">
    <a class="brand" href="{{ url_for('index') }}">🍽️ Kantin Sekolah</a>
    <nav><a href="{{ url_for('index') }}">Menu</a><a href="{{ url_for('cek_pesanan') }}">Cek Pesanan</a><a href="{{ url_for('admin') }}">Admin</a></nav>
  </div>
</header>
<main class="wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer><div class="wrap">Pre-order makanan kantin sekolah · Ambil pesanan langsung di kantin</div></footer>
</body>
</html>
